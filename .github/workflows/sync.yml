name: sync-results

# Free replacement for the always-on poller: pings the backend's /admin/sync so the
# bracket stays current even while the free host is spun down.
#
# The 2026 tournament finished on 19 Jul 2026 and every result is recorded, so the
# 10-minute schedule is off — it would burn Actions minutes re-fetching a settled
# bracket. Run it by hand (Actions → sync-results → Run workflow) if the data
# provider ever amends a result.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend sync
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Free hosts cold-start (+model train), so allow a long timeout and retries
          curl -fsS -X POST "$BACKEND_URL/admin/sync" \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            --max-time 180 --retry 3 --retry-delay 25 --retry-connrefused \
            && echo "sync ok" || echo "sync failed (backend may be waking up)"
